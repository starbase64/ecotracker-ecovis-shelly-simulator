services:
  ecotracker-proxy:
    image: python:3.13-alpine
    container_name: ecotracker-proxy
    network_mode: host
    restart: unless-stopped
    command: ["python3", "-u", "/app/ecotracker_shelly_proxy.py"]
    volumes:
      - ./ecotracker_shelly_proxy.py:/app/ecotracker_shelly_proxy.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      # --- Datenquelle ---------------------------------------------------
      ECOTRACKER_URL: "${ECOTRACKER_URL:-http://192.168.1.50:18080/v1/json}"
      ECOTRACKER_MAX_AGE_MS: "${ECOTRACKER_MAX_AGE_MS:-3000}"
      POLL_INTERVAL: "${POLL_INTERVAL:-1.0}"

      # --- eigener Endpunkt ----------------------------------------------
      LISTEN_HOST: "${LISTEN_HOST:-127.0.0.1}"
      LISTEN_PORT: "${LISTEN_PORT:-18081}"

      # --- Daempfung ------------------------------------------------------
      # Der ECOVIS verschiebt seine Leistung pro Zyklus um den gemeldeten
      # Betrag. Der volle Netzwert fuehrt zu einem Grenzzyklus.
      REPORT_GAIN_UP: "${REPORT_GAIN_UP:-0.4}"
      REPORT_GAIN_DOWN: "${REPORT_GAIN_DOWN:-0.6}"
      REPORT_DEADBAND_W: "${REPORT_DEADBAND_W:-10}"
      GRID_SMOOTH_S: "${GRID_SMOOTH_S:-3}"
      FAST_EXPORT_W: "${FAST_EXPORT_W:-30}"
      REPORT_HOLD_S: "${REPORT_HOLD_S:-5}"

      # --- Ausfallverhalten ------------------------------------------------
      STALE_S: "${STALE_S:-5}"
      STALE_HARD_S: "${STALE_HARD_S:-15}"
      SAFE_REDUCE_W: "${SAFE_REDUCE_W:--300}"
      SAFE_REDUCE_HARD_W: "${SAFE_REDUCE_HARD_W:--800}"

      # Grenzen eines einzelnen Korrektursignals. Sie begrenzen NICHT die
      # Ausgangsleistung des ECOVIS.
      MAX_CORRECTION_UP_W: "${MAX_CORRECTION_UP_W:-800}"
      MAX_CORRECTION_DOWN_W: "${MAX_CORRECTION_DOWN_W:-2000}"

  ecotracker-shelly:
    image: sdeigm/uni-meter:1.5.0
    container_name: ecotracker-shelly
    network_mode: host
    restart: unless-stopped
    depends_on:
      ecotracker-proxy:
        condition: service_healthy
    volumes:
      - ./uni-meter.conf:/etc/uni-meter.conf:ro
