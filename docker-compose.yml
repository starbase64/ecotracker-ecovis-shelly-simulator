services:
  ecotracker-limiter:
    image: python:3.13-alpine
    container_name: ecotracker-limiter
    network_mode: host
    restart: unless-stopped
    command: ["python3", "-u", "/app/ecotracker_limiter.py"]
    volumes:
      - ./ecotracker_limiter.py:/app/ecotracker_limiter.py:ro
    environment:
      # --- Datenquelle ---------------------------------------------------
      ECOTRACKER_URL: "${ECOTRACKER_URL:-http://192.168.1.50:18080/v1/json}"
      ECOTRACKER_MAX_AGE_MS: "3000"
      POLL_INTERVAL: "1.0"

      # --- eigener Endpunkt ----------------------------------------------
      LISTEN_HOST: "127.0.0.1"
      LISTEN_PORT: "18081"

      # --- Daempfung ------------------------------------------------------
      # Der ECOVIS verschiebt seine Leistung pro Zyklus um den gemeldeten
      # Betrag. Der volle Netzwert fuehrt zu einem Grenzzyklus.
      REPORT_GAIN_UP: "0.4"
      REPORT_GAIN_DOWN: "0.6"
      REPORT_DEADBAND_W: "10"
      GRID_SMOOTH_S: "3"
      FAST_EXPORT_W: "30"

      # --- Ausfallverhalten ------------------------------------------------
      STALE_S: "5"
      STALE_HARD_S: "15"
      SAFE_REDUCE_W: "-300"
      SAFE_REDUCE_HARD_W: "-800"

      # --- Deckel (experimentell, siehe README) ---------------------------
      # Ohne Messung am Ausgang nicht verlaesslich. Empfehlung: "false".
      ENABLED: "false"
      INVERTER_URL: ""
      CAP_W: "760"
      IN_FLIGHT: "3.0"
      APPLY_INTERVAL_S: "5.0"
      DEVICE_MAX_W: "1600"
      RESYNC_S: "60"
      RESYNC_W: "25"

  ecotracker-shelly:
    image: sdeigm/uni-meter:1.5.0
    container_name: ecotracker-shelly
    network_mode: host
    restart: unless-stopped
    depends_on:
      - ecotracker-limiter
    volumes:
      - ./uni-meter.conf:/etc/uni-meter.conf:ro
