name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax
        run: python -m py_compile ecotracker_shelly_proxy.py ecotracker_limiter.py tools/*.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compose configuration
        run: docker compose config --quiet
